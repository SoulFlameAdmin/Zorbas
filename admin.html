<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3efe7">
  <title>ZORBAS · Управление</title>
  <style>
    :root {
      --blue:#597aaf;
      --blue-dark:#48699d;
      --paper:#f3efe7;
      --white:#fff;
      --ink:#171a20;
      --muted:#727983;
      --line:#d9d5cd;
      --danger:#ad4444;
      --ok:#347557;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif; }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }
    .hidden { display:none !important; }
    .login {
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:24px;
      background:linear-gradient(135deg,var(--blue),var(--blue-dark));
    }
    .login-card {
      width:min(430px,100%);
      padding:34px;
      border-radius:22px;
      background:var(--paper);
      box-shadow:0 30px 90px rgba(0,0,0,.25);
    }
    .kicker { margin:0 0 6px; font-size:10px; letter-spacing:.22em; font-weight:800; color:var(--blue); }
    h1 { margin:0 0 24px; font-family:Georgia,serif; font-size:42px; font-weight:400; }
    label { display:grid; gap:7px; margin-bottom:14px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
    input,select,textarea {
      width:100%;
      min-height:46px;
      border:1px solid var(--line);
      border-radius:9px;
      background:var(--white);
      color:var(--ink);
      padding:0 12px;
      outline:none;
    }
    textarea { min-height:90px; padding-top:12px; resize:vertical; }
    input:focus,select:focus,textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(89,122,175,.13); }
    .primary,.secondary,.danger,.success {
      min-height:44px;
      border-radius:9px;
      padding:0 15px;
      font-weight:800;
    }
    .primary { border:0; background:var(--blue); color:#fff; }
    .secondary { border:1px solid var(--line); background:var(--white); color:var(--ink); }
    .danger { border:1px solid rgba(173,68,68,.25); background:rgba(173,68,68,.08); color:var(--danger); }
    .success { border:1px solid rgba(52,117,87,.25); background:rgba(52,117,87,.08); color:var(--ok); }
    .full { width:100%; }
    .message { min-height:20px; margin:12px 0 0; font-size:12px; color:var(--danger); }
    .topbar {
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      min-height:74px;
      padding:12px clamp(16px,4vw,44px);
      border-bottom:1px solid var(--line);
      background:rgba(243,239,231,.94);
      backdrop-filter:blur(12px);
    }
    .topbar h2 { margin:0; font-family:Georgia,serif; font-size:28px; font-weight:400; }
    .topbar small { color:var(--muted); }
    .top-actions { display:flex; gap:8px; }
    .shell {
      width:min(1380px,100%);
      margin:0 auto;
      padding:clamp(16px,3vw,34px);
      display:grid;
      grid-template-columns:minmax(330px,430px) 1fr;
      gap:24px;
      align-items:start;
    }
    .panel {
      border:1px solid var(--line);
      border-radius:16px;
      background:rgba(255,255,255,.58);
      overflow:hidden;
    }
    .panel-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:17px 19px;
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.5);
    }
    .panel-head h3 { margin:0; font-size:18px; }
    .panel-body { padding:19px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .form-grid label { margin:0; }
    .span-2 { grid-column:1/-1; }
    .check-row {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      grid-column:1/-1;
    }
    .check {
      display:flex;
      align-items:center;
      gap:9px;
      min-height:46px;
      padding:0 12px;
      border:1px solid var(--line);
      border-radius:9px;
      background:var(--white);
      font-size:12px;
      text-transform:none;
      letter-spacing:0;
    }
    .check input { width:18px; min-height:18px; margin:0; }
    .form-actions { display:flex; gap:8px; grid-column:1/-1; }
    .form-actions button { flex:1; }
    .category-quick {
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
      margin-top:18px;
      padding-top:18px;
      border-top:1px solid var(--line);
    }
    .category-quick input { min-height:42px; }
    .category-quick button { min-height:42px; }
    .list-tools {
      display:flex;
      gap:9px;
      align-items:center;
      width:min(520px,100%);
    }
    .list-tools input { min-height:40px; }
    .count {
      display:inline-flex;
      align-items:center;
      min-height:30px;
      padding:0 10px;
      border-radius:999px;
      background:rgba(89,122,175,.1);
      color:var(--blue-dark);
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }
    .items { display:grid; }
    .item {
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:16px;
      align-items:center;
      padding:16px 19px;
      border-bottom:1px solid var(--line);
    }
    .item:last-child { border-bottom:0; }
    .item.is-hidden { opacity:.56; }
    .item h4 { margin:0 0 5px; font-size:17px; }
    .item p { margin:0; color:var(--muted); font-size:12px; line-height:1.5; }
    .meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .tag {
      display:inline-flex;
      align-items:center;
      min-height:25px;
      padding:0 8px;
      border-radius:999px;
      background:#ece8df;
      color:#555c65;
      font-size:10px;
      font-weight:700;
    }
    .item-right { display:grid; justify-items:end; gap:9px; }
    .price { font-size:17px; font-weight:900; }
    .row-actions { display:flex; gap:6px; }
    .row-actions button { min-height:34px; padding:0 10px; font-size:11px; }
    .empty { padding:48px 20px; text-align:center; color:var(--muted); }
    @media (max-width:950px) {
      .shell { grid-template-columns:1fr; }
      .editor-panel { order:2; }
      .list-panel { order:1; }
    }
    @media (max-width:620px) {
      .topbar { align-items:flex-start; }
      .top-actions .secondary:first-child { display:none; }
      .form-grid { grid-template-columns:1fr; }
      .span-2,.check-row,.form-actions { grid-column:auto; }
      .check-row { grid-template-columns:1fr; }
      .item { grid-template-columns:1fr; }
      .item-right { justify-items:start; }
    }
  </style>
</head>
<body>
  <section class="login" id="loginView">
    <form class="login-card" id="loginForm">
      <p class="kicker">RESTAURANT ZORBAS</p>
      <h1>Управление</h1>
      <label>
        Имейл
        <input name="email" type="email" autocomplete="username" required>
      </label>
      <label>
        Парола
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="primary full" type="submit">ВХОД</button>
      <p class="message" id="loginMessage"></p>
    </form>
  </section>

  <section class="hidden" id="appView">
    <header class="topbar">
      <div>
        <small id="adminName">Zorbas Admin</small>
        <h2>Меню и кухня</h2>
      </div>
      <div class="top-actions">
        <a class="secondary" href="./pilot.html" style="display:inline-flex;align-items:center;text-decoration:none">Публичен изглед</a>
        <button class="secondary" id="signOutButton" type="button">Изход</button>
      </div>
    </header>

    <main class="shell">
      <section class="panel editor-panel">
        <div class="panel-head">
          <h3 id="editorTitle">Добави ястие</h3>
          <button class="secondary" id="newItemButton" type="button">Ново</button>
        </div>
        <div class="panel-body">
          <form class="form-grid" id="itemForm">
            <input name="id" type="hidden">
            <label class="span-2">
              Име на ястието
              <input name="name" required placeholder="Напр. Свински сувлаки">
            </label>
            <label>
              Категория
              <select name="category_id" required></select>
            </label>
            <label>
              Кухненска станция
              <select name="station_id" required></select>
            </label>
            <label>
              Цена
              <input name="price" type="number" min="0" step="0.01" required placeholder="0.00">
            </label>
            <label>
              Подредба
              <input name="sort_order" type="number" min="0" step="1" value="0">
            </label>
            <label class="span-2">
              Кратко описание
              <textarea name="short_description" placeholder="Кратък текст за менюто"></textarea>
            </label>
            <label class="span-2">
              Снимка · URL
              <input name="image_url" type="url" placeholder="https://...">
            </label>
            <label class="span-2">
              Вътрешни инструкции
              <textarea name="preparation_notes" placeholder="Инструкции за кухнята"></textarea>
            </label>
            <div class="check-row">
              <label class="check">
                <input name="available_for_pickup" type="checkbox" checked>
                За вкъщи
              </label>
              <label class="check">
                <input name="active" type="checkbox" checked>
                Видимо в менюто
              </label>
            </div>
            <div class="form-actions">
              <button class="primary" type="submit">ЗАПАЗИ</button>
              <button class="secondary" id="cancelEditButton" type="button">Изчисти</button>
            </div>
          </form>
          <p class="message" id="formMessage"></p>

          <div class="category-quick">
            <input id="newCategoryName" placeholder="Нова категория">
            <button class="secondary" id="addCategoryButton" type="button">Добави</button>
          </div>
        </div>
      </section>

      <section class="panel list-panel">
        <div class="panel-head">
          <div>
            <h3>Реално меню</h3>
          </div>
          <div class="list-tools">
            <input id="searchInput" placeholder="Търси ястие…">
            <span class="count" id="itemCount">0</span>
          </div>
        </div>
        <div class="items" id="itemsList">
          <div class="empty">Зареждане…</div>
        </div>
      </section>
    </main>
  </section>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://frhletkiuupgksmgxoxc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_JQPnalB8jOs639_PWoR6mA_AOk11xWC";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginView = document.getElementById("loginView");
    const appView = document.getElementById("appView");
    const loginForm = document.getElementById("loginForm");
    const loginMessage = document.getElementById("loginMessage");
    const itemForm = document.getElementById("itemForm");
    const formMessage = document.getElementById("formMessage");
    const itemsList = document.getElementById("itemsList");
    const searchInput = document.getElementById("searchInput");

    let user = null;
    let staff = null;
    let categories = [];
    let stations = [];
    let items = [];
    let itemStations = [];

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
      })[char]);
    }

    function slugify(value) {
      return String(value)
        .toLowerCase()
        .normalize("NFKD")
        .replace(/[^\p{L}\p{N}]+/gu, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 60) || `category-${Date.now()}`;
    }

    function showLogin(message = "") {
      loginView.classList.remove("hidden");
      appView.classList.add("hidden");
      loginMessage.textContent = message;
    }

    async function initialize() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return showLogin();
      user = session.user;

      const { data, error } = await supabase
        .from("zorbas_staff")
        .select("user_id,display_name,role,active")
        .eq("user_id", user.id)
        .single();

      if (error || !data?.active || !["manager","admin"].includes(data.role)) {
        await supabase.auth.signOut();
        return showLogin("Този профил няма право да редактира менюто.");
      }

      staff = data;
      document.getElementById("adminName").textContent = `${staff.display_name} · ${staff.role}`;
      loginView.classList.add("hidden");
      appView.classList.remove("hidden");
      await loadAll();
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginMessage.textContent = "Влизане…";
      const form = new FormData(loginForm);
      const { error } = await supabase.auth.signInWithPassword({
        email:form.get("email"),
        password:form.get("password")
      });
      if (error) return showLogin("Грешен имейл или парола.");
      await initialize();
    });

    document.getElementById("signOutButton").addEventListener("click", async () => {
      await supabase.auth.signOut();
      showLogin();
    });

    async function loadAll() {
      formMessage.textContent = "";
      const [
        { data:categoryData, error:categoryError },
        { data:stationData, error:stationError },
        { data:itemData, error:itemError },
        { data:routeData, error:routeError }
      ] = await Promise.all([
        supabase.from("zorbas_menu_categories").select("*").order("sort_order"),
        supabase.from("zorbas_kitchen_stations").select("*").order("sort_order"),
        supabase.from("zorbas_menu_items").select("*").order("sort_order").order("name"),
        supabase.from("zorbas_menu_item_stations").select("*").eq("is_primary", true)
      ]);

      const error = categoryError || stationError || itemError || routeError;
      if (error) {
        formMessage.textContent = error.message;
        return;
      }

      categories = categoryData || [];
      stations = stationData || [];
      items = itemData || [];
      itemStations = routeData || [];
      renderSelects();
      renderItems();
    }

    function renderSelects() {
      itemForm.elements.category_id.innerHTML = categories
        .filter((c) => c.active)
        .map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`)
        .join("");

      itemForm.elements.station_id.innerHTML = stations
        .filter((s) => s.active)
        .map((s) => `<option value="${s.id}">${escapeHtml(s.name)}</option>`)
        .join("");
    }

    function renderItems() {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = items.filter((item) =>
        !query ||
        item.name.toLowerCase().includes(query) ||
        (item.short_description || "").toLowerCase().includes(query)
      );

      document.getElementById("itemCount").textContent = `${filtered.length} артикула`;

      if (!filtered.length) {
        itemsList.innerHTML = '<div class="empty">Няма намерени ястия.</div>';
        return;
      }

      const categoryMap = new Map(categories.map((c) => [c.id, c]));
      const stationMap = new Map(stations.map((s) => [s.id, s]));
      const routeMap = new Map(itemStations.map((r) => [r.menu_item_id, r.station_id]));

      itemsList.innerHTML = filtered.map((item) => {
        const category = categoryMap.get(item.category_id);
        const station = stationMap.get(routeMap.get(item.id));
        return `
          <article class="item ${item.active ? "" : "is-hidden"}">
            <div>
              <h4>${escapeHtml(item.name)}</h4>
              <p>${escapeHtml(item.short_description || "Без описание")}</p>
              <div class="meta">
                <span class="tag">${escapeHtml(category?.name || "Без категория")}</span>
                <span class="tag">${escapeHtml(station?.name || "Без станция")}</span>
                <span class="tag">${item.available_for_pickup ? "За вкъщи" : "Само в ресторанта"}</span>
                ${item.active ? "" : '<span class="tag">Скрито</span>'}
              </div>
            </div>
            <div class="item-right">
              <span class="price">${Number(item.price).toFixed(2)} лв.</span>
              <div class="row-actions">
                <button class="secondary" data-edit="${item.id}" type="button">Редакция</button>
                <button class="${item.active ? "danger" : "success"}" data-toggle="${item.id}" type="button">
                  ${item.active ? "Скрий" : "Покажи"}
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");

      itemsList.querySelectorAll("[data-edit]").forEach((button) => {
        button.addEventListener("click", () => editItem(button.dataset.edit));
      });

      itemsList.querySelectorAll("[data-toggle]").forEach((button) => {
        button.addEventListener("click", () => toggleItem(button.dataset.toggle));
      });
    }

    searchInput.addEventListener("input", renderItems);

    function resetForm() {
      itemForm.reset();
      itemForm.elements.id.value = "";
      itemForm.elements.sort_order.value = "0";
      itemForm.elements.active.checked = true;
      itemForm.elements.available_for_pickup.checked = true;
      document.getElementById("editorTitle").textContent = "Добави ястие";
      formMessage.textContent = "";
      if (categories[0]) itemForm.elements.category_id.value = categories[0].id;
      if (stations[0]) itemForm.elements.station_id.value = stations[0].id;
    }

    document.getElementById("newItemButton").addEventListener("click", resetForm);
    document.getElementById("cancelEditButton").addEventListener("click", resetForm);

    function editItem(id) {
      const item = items.find((entry) => entry.id === id);
      if (!item) return;
      const route = itemStations.find((entry) => entry.menu_item_id === id);

      itemForm.elements.id.value = item.id;
      itemForm.elements.name.value = item.name;
      itemForm.elements.category_id.value = item.category_id || "";
      itemForm.elements.station_id.value = route?.station_id || "";
      itemForm.elements.price.value = item.price;
      itemForm.elements.sort_order.value = item.sort_order || 0;
      itemForm.elements.short_description.value = item.short_description || "";
      itemForm.elements.image_url.value = item.image_url || "";
      itemForm.elements.preparation_notes.value = item.preparation_notes || "";
      itemForm.elements.available_for_pickup.checked = item.available_for_pickup;
      itemForm.elements.active.checked = item.active;

      document.getElementById("editorTitle").textContent = `Редакция · ${item.name}`;
      window.scrollTo({ top:0, behavior:"smooth" });
    }

    itemForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const submit = itemForm.querySelector(".primary");
      const data = new FormData(itemForm);
      submit.disabled = true;
      formMessage.style.color = "var(--muted)";
      formMessage.textContent = "Запазване…";

      const payload = {
        name:data.get("name").trim(),
        category_id:data.get("category_id"),
        price:Number(data.get("price")),
        sort_order:Number(data.get("sort_order") || 0),
        short_description:data.get("short_description").trim() || null,
        image_url:data.get("image_url").trim() || null,
        preparation_notes:data.get("preparation_notes").trim() || null,
        available_for_pickup:itemForm.elements.available_for_pickup.checked,
        active:itemForm.elements.active.checked,
        updated_by:user.id
      };

      try {
        let itemId = data.get("id");
        if (itemId) {
          const { error } = await supabase
            .from("zorbas_menu_items")
            .update(payload)
            .eq("id", itemId);
          if (error) throw error;
        } else {
          payload.code = `${slugify(payload.name)}-${Date.now().toString().slice(-5)}`;
          payload.created_by = user.id;
          const { data:created, error } = await supabase
            .from("zorbas_menu_items")
            .insert(payload)
            .select("id")
            .single();
          if (error) throw error;
          itemId = created.id;
        }

        const { error:deleteError } = await supabase
          .from("zorbas_menu_item_stations")
          .delete()
          .eq("menu_item_id", itemId);
        if (deleteError) throw deleteError;

        const { error:routeError } = await supabase
          .from("zorbas_menu_item_stations")
          .insert({
            menu_item_id:itemId,
            station_id:data.get("station_id"),
            is_primary:true
          });
        if (routeError) throw routeError;

        formMessage.style.color = "var(--ok)";
        formMessage.textContent = "Запазено успешно.";
        await loadAll();
        resetForm();
      } catch (error) {
        formMessage.style.color = "var(--danger)";
        formMessage.textContent = error.message;
      } finally {
        submit.disabled = false;
      }
    });

    async function toggleItem(id) {
      const item = items.find((entry) => entry.id === id);
      if (!item) return;
      const { error } = await supabase
        .from("zorbas_menu_items")
        .update({ active:!item.active, updated_by:user.id })
        .eq("id", id);
      if (error) return alert(error.message);
      await loadAll();
    }

    document.getElementById("addCategoryButton").addEventListener("click", async () => {
      const input = document.getElementById("newCategoryName");
      const name = input.value.trim();
      if (name.length < 2) return;

      const maxSort = Math.max(0, ...categories.map((c) => c.sort_order || 0));
      const { error } = await supabase
        .from("zorbas_menu_categories")
        .insert({
          code:`${slugify(name)}-${Date.now().toString().slice(-4)}`,
          name,
          sort_order:maxSort + 10
        });
      if (error) return alert(error.message);
      input.value = "";
      await loadAll();
    });

    initialize();
  </script>
</body>
</html>
