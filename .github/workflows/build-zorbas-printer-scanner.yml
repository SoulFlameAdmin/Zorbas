name: Build Zorbas Printer Scanner

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/zorbas-printer-scanner
    paths:
      - "scanner/**"
      - ".github/workflows/build-zorbas-printer-scanner.yml"
  pull_request:
    paths:
      - "scanner/**"
      - ".github/workflows/build-zorbas-printer-scanner.yml"

permissions:
  contents: write

concurrency:
  group: zorbas-printer-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate PowerShell analysis module
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scanner/ZorbasPrinterScanner/PrinterScan.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            throw "PrinterScan.ps1 contains syntax errors."
          }

      - name: Restore
        run: dotnet restore scanner/ZorbasPrinterScanner/ZorbasPrinterScanner.csproj

      - name: Publish single-file EXE
        shell: pwsh
        run: |
          $output = Join-Path $PWD "scanner/artifacts/win-x64"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          dotnet publish scanner/ZorbasPrinterScanner/ZorbasPrinterScanner.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output $output `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -p:IncludeNativeLibrariesForSelfExtract=true
          $exe = Join-Path $output "Zorbas-Printer-Scanner.exe"
          if (-not (Test-Path $exe)) {
            throw "Zorbas-Printer-Scanner.exe was not produced."
          }

      - name: Smoke-test embedded resource
        shell: pwsh
        run: |
          $exe = Resolve-Path "scanner/artifacts/win-x64/Zorbas-Printer-Scanner.exe"
          if ((Get-Item $exe).Length -lt 1000000) {
            throw "Scanner EXE is unexpectedly small."
          }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $exe = Resolve-Path "scanner/artifacts/win-x64/Zorbas-Printer-Scanner.exe"
          $hash = Get-FileHash $exe -Algorithm SHA256 | Select-Object -ExpandProperty Hash
          "$hash  Zorbas-Printer-Scanner.exe" | Set-Content "scanner/artifacts/SHA256SUMS.txt" -Encoding ascii

      - name: Upload Windows scanner package
        uses: actions/upload-artifact@v4
        with:
          name: Zorbas-Printer-Scanner-windows-x64
          path: |
            scanner/artifacts/win-x64/Zorbas-Printer-Scanner.exe
            scanner/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish scanner v1.0.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "zorbas-printer-scanner-v1.0.0"
          $exe = "scanner/artifacts/win-x64/Zorbas-Printer-Scanner.exe"
          $checksums = "scanner/artifacts/SHA256SUMS.txt"

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $checksums --clobber
          }
          else {
            gh release create $tag $exe $checksums `
              --target $env:GITHUB_SHA `
              --title "Zorbas Printer Scanner v1.0.0" `
              --notes "Read-only Windows x64 utility that creates a local ZIP report of printer queues, drivers, USB/LAN ports, printer IP addresses, spooler state and related POS/printing software. It does not print, change settings or upload data automatically." `
              --latest
          }
