name: Waiter checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  waiter-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check admin.js
          node --check admin-core.js
          node --check admin-order.js
          node --check admin-waiter.js
          node --check admin-waiter-hook.js
          node --check admin-waiter-v2.js
          node --check admin-keyboard-fix-v3.js
          node --check admin-menu.js
          node --check live-sync.js
          node --check waiter-stable.js
          node --check waiter-order-idempotency.js
          node --check waiter-reservation-guests.js
          node --check waiter-reservation-status.js
          node --check print-browser-safety.js
          node --check print.js
          node --check kitchen.js
          node --check sw.js

      - name: Test waiter flow
        run: node tests/waiter-flow.test.js

      - name: Test waiter order retry idempotency
        run: node tests/waiter-order-idempotency.test.js

      - name: Test waiter reservation status controls
        run: node tests/waiter-reservation-status.test.js

      - name: Test print and offline recovery safety
        run: node tests/print-recovery-safety.test.js
