name: Build SoulFlame Restaurant Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/soulflame-bridge-1-2-7
    paths:
      - "bridge/**"
      - ".github/workflows/build-zorbas-bridge.yml"
  pull_request:
    paths:
      - "bridge/**"
      - ".github/workflows/build-zorbas-bridge.yml"

permissions:
  contents: write

concurrency:
  group: soulflame-restaurant-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore bridge/ZorbasBridge/ZorbasBridge.csproj

      - name: Build
        run: dotnet build bridge/ZorbasBridge/ZorbasBridge.csproj --configuration Release --no-restore

      - name: Publish self-contained EXE
        shell: pwsh
        run: |
          $output = Join-Path $PWD "bridge/artifacts/win-x64"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          dotnet publish bridge/ZorbasBridge/ZorbasBridge.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output $output `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -p:IncludeNativeLibrariesForSelfExtract=true
          if (-not (Test-Path (Join-Path $output "ZorbasBridge.exe"))) {
            throw "ZorbasBridge.exe was not produced."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found." }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "bridge/installer/ZorbasBridge.iss"
          $setup = Join-Path $PWD "bridge/artifacts/installer/SoulFlame-Restaurant-Bridge-Setup.exe"
          if (-not (Test-Path $setup)) { throw "SoulFlame-Restaurant-Bridge-Setup.exe was not produced." }

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "bridge/artifacts/win-x64/ZorbasBridge.exe"
          $setup = Join-Path $PWD "bridge/artifacts/installer/SoulFlame-Restaurant-Bridge-Setup.exe"
          $lines = @(
            "$(Get-FileHash $exe -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  ZorbasBridge.exe",
            "$(Get-FileHash $setup -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  SoulFlame-Restaurant-Bridge-Setup.exe"
          )
          $lines | Set-Content -Path "bridge/artifacts/SHA256SUMS.txt" -Encoding ascii

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SoulFlame-Restaurant-Bridge-windows-x64-v1.2.7
          path: |
            bridge/artifacts/win-x64/ZorbasBridge.exe
            bridge/artifacts/installer/SoulFlame-Restaurant-Bridge-Setup.exe
            bridge/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable v1.2.7 release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "soulflame-restaurant-bridge-v1.2.7"
          $setup = "bridge/artifacts/installer/SoulFlame-Restaurant-Bridge-Setup.exe"
          $exe = "bridge/artifacts/win-x64/ZorbasBridge.exe"
          $checksums = "bridge/artifacts/SHA256SUMS.txt"

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; published assets stay immutable."
            exit 0
          }

          gh release create $tag $setup $exe $checksums `
            --target $env:GITHUB_SHA `
            --title "SoulFlame Restaurant Bridge v1.2.7" `
            --notes "Secure Restaurant OS Bridge: one-time 10-minute Pair Code, DPAPI-protected device token, entitlement-aware queue access, and compatibility with already-paired installations. Physical printer certification remains a separate final hardware step." `
            --latest
