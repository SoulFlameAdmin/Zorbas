name: Route reservations to standalone page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/route-reservations.yml'
      - 'reserve-launcher.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add direct reservation launcher
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="/reserve-launcher.js?v=20260730-2"></script>'
          if tag not in text:
              if '</body>' in text:
                  text = text.replace('</body>', tag + '</body>', 1)
              else:
                  text += tag
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit route
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Route reservation button to standalone page"
          git push
