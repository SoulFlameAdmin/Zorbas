name: Verify unified live state

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify JavaScript syntax
        run: |
          node --check live-sync.js
          node --check reserve.js
          node --check admin.js
          node --check admin-live-state.js
          node --check kitchen.js
          node --check kitchen-live.js
      - name: Verify live-state integration is already present
        run: |
          grep -q 'src="/live-sync.js' admin.html
          grep -q 'src="/live-sync.js' kitchen.html
          grep -q 'src="/kitchen-live.js' kitchen.html
          grep -q 'admin-live-state.js' admin.js
          grep -Fq 'ZorbasLive?.subscribe' reserve.js
      - name: Guard against legacy auto-patching
        run: |
          ! grep -q 'git push' .github/workflows/apply-unified-live-state.yml
          ! grep -q 'contents: write' .github/workflows/apply-unified-live-state.yml
