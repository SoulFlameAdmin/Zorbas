name: Zorbas Bridge checks

on:
  push:
    branches: [main]
    paths:
      - 'bridge/ZorbasBridge/**'
      - 'supabase/migrations/20260910184500_zorbas_test_no_print_global_safety_v1.sql'
      - '.github/workflows/bridge-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bridge/ZorbasBridge/**'
      - 'supabase/migrations/20260910184500_zorbas_test_no_print_global_safety_v1.sql'
      - '.github/workflows/bridge-check.yml'
  workflow_dispatch:

jobs:
  build-bridge:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Bridge
        run: dotnet restore bridge/ZorbasBridge/ZorbasBridge.csproj

      - name: Build Bridge
        run: dotnet build bridge/ZorbasBridge/ZorbasBridge.csproj -c Release --no-restore

      - name: Verify test-no-print physical safety
        shell: pwsh
        run: |
          $engine = Get-Content 'bridge/ZorbasBridge/BridgeEngine.cs' -Raw
          $models = Get-Content 'bridge/ZorbasBridge/Models.cs' -Raw
          $safety = Get-Content 'supabase/migrations/20260910184500_zorbas_test_no_print_global_safety_v1.sql' -Raw

          if ($models -notmatch 'JsonPropertyName\("operating_mode"\)') { throw 'claimed job must deserialize authoritative operating mode' }
          if ($safety -notmatch "jsonb_build_object\('operating_mode',v_mode\)") { throw 'claim RPC must return authoritative operating mode' }
          if ($safety -notmatch "operating_mode_at_claim") { throw 'claim audit metadata must preserve operating mode' }
          if ($safety -notmatch "v_required_number integer := 1002004") { throw 'test_no_print must enforce the minimum safe Bridge version' }
          if ($safety -notmatch "TEST_NO_PRINT_REQUIRES_EMPTY_QUEUE") { throw 'mode transition must require an empty unresolved print queue' }
          if ($safety -notmatch "TEST_NO_PRINT_BROWSER_CLAIM_BLOCKED") { throw 'browser Print Center claims must be blocked in test_no_print' }
          if ($safety -notmatch "TEST_NO_PRINT_BROWSER_PHYSICAL_STATE_BLOCKED") { throw 'browser physical ACK states must be blocked in test_no_print' }
          $modeLocks = ([regex]::Matches($safety, "hashtextextended\('zorbas-print-mode:'")).Count
          if ($modeLocks -lt 4) { throw 'mode set, Bridge claim, browser claim and browser ACK must share the mode advisory lock' }
          if ($engine -notmatch 'var authoritativeMode = job\.OperatingMode;') { throw 'Bridge must use mode returned with each claim' }
          if ($engine -notmatch 'var simulateOnly = authoritativeMode == BridgeModes\.TestNoPrint;') { throw 'simulation gate must use authoritative claim mode' }
          if ($engine -notmatch 'var physicalAllowed = authoritativeMode is BridgeModes\.Parallel or BridgeModes\.SoulFlame;') { throw 'physical output must be explicitly allowlisted' }
          if ($engine -notmatch '\[SAFE_NO_OUTPUT\].*authoritative operating mode') { throw 'unknown mode must fail closed before physical output' }
          if ($engine -notmatch 'no_physical_output = true') { throw 'simulation ACK must declare no physical output' }
          if ($engine -notmatch 'Never enter sending/printing in test_no_print') { throw 'physical-stage invariant missing' }
          if ($engine -notmatch 'var ambiguousPhysicalOutput = physicalAllowed') { throw 'physical ambiguity must be impossible outside physical modes' }
          if ($engine -notmatch 'RefreshOperatingModeAsync') { throw 'direct hardware test must refresh server mode before deciding' }
