name: Rebuild latest Zorbas hero

on:
  push:
    branches:
      - hero/latest-chat-image-20260910
    paths:
      - .hero-chunks/READY

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hero/latest-chat-image-20260910
          fetch-depth: 0

      - name: Rebuild binary hero from chunks
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p assets
          cat .hero-chunks/part_*.txt | base64 --decode > assets/zorbas-hero-latest.webp
          bytes=$(wc -c < assets/zorbas-hero-latest.webp)
          echo "Hero bytes: $bytes"
          test "$bytes" -gt 1000000
          file assets/zorbas-hero-latest.webp | grep -qi webp

      - name: Commit only final hero asset
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .hero-chunks
          git rm .github/workflows/rebuild-latest-hero.yml
          git add assets/zorbas-hero-latest.webp
          git commit -m 'Add latest Zorbas hero image asset'
          git push origin HEAD:hero/latest-chat-image-20260910
