name: Import Zorbas hero from Supabase

on:
  push:
    paths:
      - '.github/workflows/import-zorbas-menu-columns-hero.yml'

permissions:
  contents: write

jobs:
  import-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download exact Supabase PNG
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://frhletkiuupgksmgxoxc.supabase.co/storage/v1/object/public/zorbas-public-assets/homepage/zorbasentrancedesktopclear-e2711813c5c3187a.png' \
            -o ZORBASMENUCOLUMNS.png
          test -s ZORBASMENUCOLUMNS.png
          file ZORBASMENUCOLUMNS.png
          sha256sum ZORBASMENUCOLUMNS.png

      - name: Point homepage hero to repository PNG with no blur
        shell: python
        run: |
          from pathlib import Path
          p = Path('site.css')
          p.write_text("""@import url('/site-base.css?v=hero-local-zorbasmenucolumns-20260910');

/* Exact ZORBASMENUCOLUMNS hero — repository asset, clean and sharp */
.hero:before{
  background-image:url('/ZORBASMENUCOLUMNS.png?v=20260910-2215')!important;
  background-position:center center!important;
  background-size:cover!important;
  background-repeat:no-repeat!important;
  transform:none!important;
  animation:none!important;
  filter:none!important;
  opacity:1!important;
}
.hero:after{
  background:linear-gradient(180deg,rgba(8,7,5,.06),rgba(8,7,5,.12))!important;
}
.home:before{
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
}
@media(max-width:680px){
  .hero:before{
    background-image:url('/ZORBASMENUCOLUMNS.png?v=20260910-2215')!important;
    background-position:center center!important;
    background-size:cover!important;
    transform:none!important;
    animation:none!important;
    filter:none!important;
    opacity:1!important;
  }
}
""", encoding='utf-8')

      - name: Commit hero asset and CSS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SoulFlameAdmin'
          git config user.email 'soulflame.mitko@gmail.com'
          git add ZORBASMENUCOLUMNS.png site.css
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Use ZORBASMENUCOLUMNS original hero from Supabase'
          git push origin main
