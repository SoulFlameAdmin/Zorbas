<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>ZORBAS · Кухня</title>
  <style>
    :root {
      --bg:#0b0f16;
      --panel:#131a24;
      --panel-2:#192231;
      --text:#f8fafc;
      --muted:#9aa6b5;
      --line:#283447;
      --brand:#6f8fbe;
      --warning:#d9a441;
      --danger:#d65d5d;
      --ok:#54a779;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif; }
    button,input,select { font:inherit; }
    button { color:inherit; }
    .hidden { display:none !important; }
    .login {
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:24px;
      background:
        radial-gradient(circle at top right, rgba(111,143,190,.22), transparent 38%),
        var(--bg);
    }
    .login-card {
      width:min(440px,100%);
      padding:32px;
      border:1px solid var(--line);
      border-radius:20px;
      background:var(--panel);
      box-shadow:0 30px 80px rgba(0,0,0,.35);
    }
    .brand { margin:0 0 6px; font-size:13px; letter-spacing:.25em; color:var(--muted); }
    h1 { margin:0 0 24px; font-size:38px; }
    label { display:grid; gap:7px; margin-bottom:15px; color:var(--muted); font-size:12px; }
    input,select {
      min-height:48px;
      border:1px solid var(--line);
      border-radius:10px;
      background:#0f1520;
      color:var(--text);
      padding:0 13px;
      outline:none;
    }
    .primary,.secondary,.danger,.success {
      min-height:46px;
      border:0;
      border-radius:10px;
      padding:0 16px;
      font-weight:700;
      cursor:pointer;
    }
    .primary { width:100%; background:var(--brand); }
    .secondary { background:var(--panel-2); border:1px solid var(--line); }
    .danger { background:rgba(214,93,93,.16); color:#ffabab; border:1px solid rgba(214,93,93,.35); }
    .success { background:rgba(84,167,121,.18); color:#9ce0b7; border:1px solid rgba(84,167,121,.35); }
    .message { min-height:20px; margin:14px 0 0; color:#ffb4b4; font-size:12px; }
    .app { min-height:100dvh; }
    .topbar {
      position:sticky;
      top:0;
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      min-height:76px;
      padding:12px clamp(14px,3vw,30px);
      border-bottom:1px solid var(--line);
      background:rgba(11,15,22,.92);
      backdrop-filter:blur(14px);
    }
    .topbar h2 { margin:0; font-size:23px; }
    .topbar small { color:var(--muted); }
    .top-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
    .online-dot { display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:50%; background:var(--ok); }
    .layout {
      display:grid;
      grid-template-columns:250px 1fr;
      min-height:calc(100dvh - 77px);
    }
    aside {
      padding:20px;
      border-right:1px solid var(--line);
      background:#0e141d;
    }
    .aside-title { margin:0 0 10px; color:var(--muted); font-size:11px; letter-spacing:.16em; text-transform:uppercase; }
    .stations { display:grid; gap:8px; }
    .station {
      width:100%;
      min-height:50px;
      padding:0 13px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--panel);
      text-align:left;
      cursor:pointer;
    }
    .station.active { background:var(--brand); border-color:transparent; }
    .shift-card {
      margin-top:22px;
      padding:15px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--panel);
    }
    .shift-state { margin:0 0 12px; font-size:13px; color:var(--muted); }
    main { padding:clamp(14px,3vw,30px); }
    .queue-head {
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:16px;
      margin-bottom:18px;
    }
    .queue-head h3 { margin:0; font-size:30px; }
    .queue-head p { margin:6px 0 0; color:var(--muted); font-size:13px; }
    .filters { display:flex; gap:8px; }
    .filter {
      min-height:38px;
      border:1px solid var(--line);
      border-radius:999px;
      padding:0 13px;
      background:var(--panel);
      cursor:pointer;
      color:var(--muted);
    }
    .filter.active { color:var(--text); border-color:var(--brand); }
    .queue {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:14px;
      align-items:start;
    }
    .ticket {
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--panel);
      box-shadow:0 16px 35px rgba(0,0,0,.18);
    }
    .ticket.late { border-color:rgba(217,164,65,.75); }
    .ticket-head {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      padding:16px;
      border-bottom:1px solid var(--line);
      background:var(--panel-2);
    }
    .table-no { font-size:25px; font-weight:800; }
    .order-no { margin-top:3px; color:var(--muted); font-size:11px; }
    .age {
      padding:6px 9px;
      border-radius:999px;
      background:#0d131c;
      color:var(--muted);
      font-size:11px;
      white-space:nowrap;
    }
    .late .age { background:rgba(217,164,65,.17); color:#ffd482; }
    .ticket-note {
      margin:0;
      padding:12px 16px;
      border-bottom:1px solid var(--line);
      color:#ffd7a0;
      font-size:12px;
      line-height:1.5;
    }
    .items { display:grid; }
    .item {
      display:grid;
      grid-template-columns:auto 1fr;
      gap:12px;
      padding:15px 16px;
      border-bottom:1px solid var(--line);
    }
    .qty {
      display:grid;
      place-items:center;
      width:36px;
      height:36px;
      border-radius:10px;
      background:#0d131c;
      font-size:17px;
      font-weight:800;
    }
    .item h4 { margin:0; font-size:16px; }
    .item-note { margin:5px 0 0; color:#ffcc96; font-size:12px; line-height:1.4; font-weight:700; }
    .item-status { margin-top:6px; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.1em; }
    .item-actions {
      display:flex;
      gap:7px;
      grid-column:1/-1;
      margin-top:2px;
    }
    .item-actions button {
      flex:1;
      min-height:38px;
      border:1px solid var(--line);
      border-radius:9px;
      background:var(--panel-2);
      cursor:pointer;
      font-weight:700;
      font-size:12px;
    }
    .item-actions .ready { background:rgba(84,167,121,.18); border-color:rgba(84,167,121,.45); color:#a8e7bf; }
    .ticket-foot {
      display:flex;
      justify-content:space-between;
      gap:12px;
      padding:13px 16px;
      color:var(--muted);
      font-size:11px;
    }
    .empty {
      grid-column:1/-1;
      padding:60px 20px;
      border:1px dashed var(--line);
      border-radius:16px;
      text-align:center;
      color:var(--muted);
    }
    @media (max-width:800px) {
      .layout { grid-template-columns:1fr; }
      aside { border-right:0; border-bottom:1px solid var(--line); }
      .stations { display:flex; overflow:auto; }
      .station { min-width:max-content; }
      .shift-card { display:flex; align-items:center; justify-content:space-between; gap:10px; }
      .shift-state { margin:0; }
      .topbar { align-items:flex-start; }
      .top-actions .secondary:last-child { display:none; }
    }
  </style>
</head>
<body>
  <section class="login" id="loginView">
    <form class="login-card" id="loginForm">
      <p class="brand">RESTAURANT ZORBAS</p>
      <h1>Кухненски екран</h1>
      <label>
        Имейл
        <input name="email" type="email" autocomplete="username" required>
      </label>
      <label>
        Парола
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="primary" type="submit">ВХОД</button>
      <p class="message" id="loginMessage"></p>
    </form>
  </section>

  <section class="app hidden" id="appView">
    <header class="topbar">
      <div>
        <small><span class="online-dot"></span>Свързано със Supabase</small>
        <h2 id="screenTitle">Кухня</h2>
      </div>
      <div class="top-actions">
        <button class="secondary" id="refreshButton" type="button">Обнови</button>
        <button class="secondary" id="signOutButton" type="button">Изход</button>
      </div>
    </header>

    <div class="layout">
      <aside>
        <p class="aside-title">Станция</p>
        <div class="stations" id="stations"></div>
        <div class="shift-card">
          <p class="shift-state" id="shiftState">Проверка на смяната…</p>
          <button class="success" id="shiftButton" type="button">Започвам смяна</button>
        </div>
      </aside>

      <main>
        <div class="queue-head">
          <div>
            <h3 id="queueTitle">Поръчки</h3>
            <p>Най-старите са първи. След 10 минути картата се маркира.</p>
          </div>
          <div class="filters">
            <button class="filter active" data-filter="active" type="button">Активни</button>
            <button class="filter" data-filter="ready" type="button">Готови</button>
          </div>
        </div>
        <section class="queue" id="queue"></section>
      </main>
    </div>
  </section>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://frhletkiuupgksmgxoxc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_JQPnalB8jOs639_PWoR6mA_AOk11xWC";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginView = document.getElementById("loginView");
    const appView = document.getElementById("appView");
    const loginForm = document.getElementById("loginForm");
    const loginMessage = document.getElementById("loginMessage");
    const stationsEl = document.getElementById("stations");
    const queueEl = document.getElementById("queue");
    const shiftState = document.getElementById("shiftState");
    const shiftButton = document.getElementById("shiftButton");
    const queueTitle = document.getElementById("queueTitle");
    const screenTitle = document.getElementById("screenTitle");

    let user = null;
    let staff = null;
    let stations = [];
    let selectedStation = null;
    let activeShift = null;
    let filter = "active";
    let refreshTimer = null;

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
      })[char]);
    }

    function showLogin(message = "") {
      loginView.classList.remove("hidden");
      appView.classList.add("hidden");
      loginMessage.textContent = message;
    }

    async function initialize() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return showLogin();
      user = session.user;

      const { data, error } = await supabase
        .from("zorbas_staff")
        .select("user_id,display_name,role,station_id,active")
        .eq("user_id", user.id)
        .single();

      if (error || !data?.active || !["kitchen","manager","admin"].includes(data.role)) {
        await supabase.auth.signOut();
        return showLogin("Този профил няма достъп до кухнята.");
      }

      staff = data;
      loginView.classList.add("hidden");
      appView.classList.remove("hidden");
      screenTitle.textContent = `${staff.display_name} · Кухня`;

      await Promise.all([loadStations(), loadShift()]);
      await loadQueue();
      subscribeRealtime();
      refreshTimer = setInterval(loadQueue, 15000);
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginMessage.textContent = "Влизане…";
      const form = new FormData(loginForm);
      const { error } = await supabase.auth.signInWithPassword({
        email: form.get("email"),
        password: form.get("password")
      });
      if (error) return showLogin("Грешен имейл или парола.");
      await initialize();
    });

    document.getElementById("signOutButton").addEventListener("click", async () => {
      clearInterval(refreshTimer);
      await supabase.auth.signOut();
      showLogin();
    });

    document.getElementById("refreshButton").addEventListener("click", loadQueue);

    async function loadStations() {
      const { data, error } = await supabase
        .from("zorbas_kitchen_stations")
        .select("id,code,name,sort_order")
        .eq("active", true)
        .order("sort_order");

      if (error) throw error;
      stations = data || [];

      if (staff.station_id) {
        selectedStation = stations.find((s) => s.id === staff.station_id) || stations[0];
      } else {
        selectedStation = selectedStation || stations[0];
      }

      renderStations();
    }

    function renderStations() {
      stationsEl.innerHTML = stations.map((station) => `
        <button
          class="station ${selectedStation?.id === station.id ? "active" : ""}"
          type="button"
          data-station="${station.id}"
          ${staff.station_id && staff.station_id !== station.id ? "disabled" : ""}
        >${escapeHtml(station.name)}</button>
      `).join("");

      stationsEl.querySelectorAll("[data-station]").forEach((button) => {
        button.addEventListener("click", async () => {
          selectedStation = stations.find((s) => s.id === button.dataset.station);
          renderStations();
          await loadQueue();
        });
      });
    }

    async function loadShift() {
      const { data } = await supabase
        .from("zorbas_shifts")
        .select("id,started_at,ended_at")
        .eq("staff_id", user.id)
        .is("ended_at", null)
        .maybeSingle();

      activeShift = data || null;
      renderShift();
    }

    function renderShift() {
      if (activeShift) {
        const started = new Date(activeShift.started_at).toLocaleTimeString("bg-BG", { hour:"2-digit", minute:"2-digit" });
        shiftState.textContent = `🟢 На работа от ${started}`;
        shiftButton.textContent = "Приключвам смяна";
        shiftButton.className = "danger";
      } else {
        shiftState.textContent = "⚪ Извън работа";
        shiftButton.textContent = "Започвам смяна";
        shiftButton.className = "success";
      }
    }

    shiftButton.addEventListener("click", async () => {
      shiftButton.disabled = true;
      try {
        if (activeShift) {
          const { error } = await supabase
            .from("zorbas_shifts")
            .update({ ended_at:new Date().toISOString(), end_reason:"manual" })
            .eq("id", activeShift.id);
          if (error) throw error;
        } else {
          const { error } = await supabase
            .from("zorbas_shifts")
            .insert({ staff_id:user.id });
          if (error) throw error;
        }
        await loadShift();
      } catch (error) {
        alert(error.message);
      } finally {
        shiftButton.disabled = false;
      }
    });

    document.querySelectorAll("[data-filter]").forEach((button) => {
      button.addEventListener("click", async () => {
        filter = button.dataset.filter;
        document.querySelectorAll("[data-filter]").forEach((b) => b.classList.toggle("active", b === button));
        await loadQueue();
      });
    });

    async function loadQueue() {
      if (!selectedStation) {
        queueEl.innerHTML = '<div class="empty">Няма избрана станция.</div>';
        return;
      }

      queueTitle.textContent = selectedStation.name;
      const statuses = filter === "ready" ? ["ready"] : ["sent","preparing"];

      const { data: items, error } = await supabase
        .from("zorbas_order_items")
        .select("id,order_id,item_name,quantity,note,status,created_at,updated_at")
        .eq("station_id", selectedStation.id)
        .in("status", statuses)
        .order("created_at");

      if (error) {
        queueEl.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
        return;
      }

      if (!items?.length) {
        queueEl.innerHTML = `<div class="empty">${filter === "ready" ? "Няма готови артикули." : "Няма чакащи поръчки за тази станция."}</div>`;
        return;
      }

      const orderIds = [...new Set(items.map((item) => item.order_id))];
      const { data: orders } = await supabase
        .from("zorbas_orders")
        .select("id,order_number,table_id,waiter_id,note,created_at,order_type")
        .in("id", orderIds);

      const tableIds = [...new Set((orders || []).map((o) => o.table_id).filter(Boolean))];
      const waiterIds = [...new Set((orders || []).map((o) => o.waiter_id).filter(Boolean))];

      const [{ data: tables }, { data: waiters }] = await Promise.all([
        tableIds.length
          ? supabase.from("zorbas_restaurant_tables").select("id,table_number").in("id", tableIds)
          : Promise.resolve({ data:[] }),
        waiterIds.length
          ? supabase.from("zorbas_staff").select("user_id,display_name").in("user_id", waiterIds)
          : Promise.resolve({ data:[] })
      ]);

      const orderMap = new Map((orders || []).map((o) => [o.id, o]));
      const tableMap = new Map((tables || []).map((t) => [t.id, t]));
      const waiterMap = new Map((waiters || []).map((w) => [w.user_id, w]));
      const groups = new Map();

      items.forEach((item) => {
        if (!groups.has(item.order_id)) groups.set(item.order_id, []);
        groups.get(item.order_id).push(item);
      });

      queueEl.innerHTML = [...groups.entries()].map(([orderId, orderItems]) => {
        const order = orderMap.get(orderId) || {};
        const table = tableMap.get(order.table_id);
        const waiter = waiterMap.get(order.waiter_id);
        const created = new Date(Math.min(...orderItems.map((i) => new Date(i.created_at).getTime())));
        const ageMinutes = Math.max(0, Math.floor((Date.now() - created.getTime()) / 60000));
        const late = ageMinutes >= 10 && filter === "active";
        const tableLabel = order.order_type === "pickup" ? "За вкъщи" : `Маса ${table?.table_number || "—"}`;

        return `
          <article class="ticket ${late ? "late" : ""}">
            <header class="ticket-head">
              <div>
                <div class="table-no">${escapeHtml(tableLabel)}</div>
                <div class="order-no">Поръчка №${escapeHtml(order.order_number || "—")}</div>
              </div>
              <div class="age">${ageMinutes} мин.</div>
            </header>
            ${order.note ? `<p class="ticket-note">⚠ ${escapeHtml(order.note)}</p>` : ""}
            <div class="items">
              ${orderItems.map(renderItem).join("")}
            </div>
            <footer class="ticket-foot">
              <span>${escapeHtml(waiter?.display_name || "Сервитьор")}</span>
              <span>${created.toLocaleTimeString("bg-BG", { hour:"2-digit", minute:"2-digit" })}</span>
            </footer>
          </article>
        `;
      }).join("");

      queueEl.querySelectorAll("[data-item-status]").forEach((button) => {
        button.addEventListener("click", async () => {
          button.disabled = true;
          const { error } = await supabase.rpc("zorbas_set_order_item_status", {
            p_item_id:button.dataset.itemId,
            p_status:button.dataset.itemStatus
          });
          if (error) alert(error.message);
          await loadQueue();
        });
      });
    }

    function renderItem(item) {
      return `
        <div class="item">
          <div class="qty">${escapeHtml(item.quantity)}×</div>
          <div>
            <h4>${escapeHtml(item.item_name)}</h4>
            ${item.note ? `<p class="item-note">⚠ ${escapeHtml(item.note)}</p>` : ""}
            <div class="item-status">${item.status === "preparing" ? "Приготвя се" : item.status === "ready" ? "Готово" : "Нова поръчка"}</div>
          </div>
          <div class="item-actions">
            ${item.status !== "preparing" && item.status !== "ready"
              ? `<button data-item-id="${item.id}" data-item-status="preparing">ЗАПОЧВАМ</button>`
              : ""}
            ${item.status !== "ready"
              ? `<button class="ready" data-item-id="${item.id}" data-item-status="ready">ГОТОВО</button>`
              : ""}
          </div>
        </div>
      `;
    }

    function subscribeRealtime() {
      supabase
        .channel("zorbas-kitchen")
        .on("postgres_changes", {
          event:"*",
          schema:"public",
          table:"zorbas_order_items"
        }, () => loadQueue())
        .on("postgres_changes", {
          event:"*",
          schema:"public",
          table:"zorbas_orders"
        }, () => loadQueue())
        .subscribe();
    }

    initialize();
  </script>
</body>
</html>
