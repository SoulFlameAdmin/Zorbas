<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zorbas">
  <title>ZORBAS · Сервитьори</title>
  <link rel="manifest" href="/manifest.webmanifest?v=launch8">
  <link rel="icon" href="/icon-192.png?v=tower6" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=tower6">
  <link rel="stylesheet" href="/waiter-stable.css?v=20260904-stable2">
</head>
<body class="waiter-stable-page">
  <div id="waiterStableApp">
    <section class="ws-login" id="waiterLoginView">
      <form class="ws-login-card" id="waiterLoginForm">
        <div class="ws-login-language" aria-label="Избери език / Choose language"><span>Език / Language</span><button type="button" data-language="bg">BG</button><button type="button" data-language="en">EN</button></div>
        <p class="ws-kicker">RESTAURANT ZORBAS</p>
        <h1>Сервитьори</h1>
        <label class="ws-field">Вашето име<input name="display_name" required autocomplete="name"></label>
        <label class="ws-field">Потребител<input name="username" required autocomplete="username"></label>
        <label class="ws-field">Парола<input name="password" type="password" required autocomplete="current-password"></label>
        <button class="ws-primary ws-full" type="submit">ВХОД</button>
        <p class="ws-message" id="waiterLoginMessage"></p>
      </form>
    </section>
    <section class="ws-shell ws-hidden" id="waiterStableShell">
      <header class="ws-topbar">
        <button class="ws-icon-button" id="waiterStableMenuToggle" type="button" aria-label="Отвори меню">☰</button>
        <div class="ws-top-title"><small id="waiterStableSubtitle">ZORBAS</small><strong id="waiterStableTitle">Сервитьори</strong></div>
        <span class="ws-status-dot" id="waiterStableStatusDot" aria-label="Връзка / Connection"></span>
        <div class="ws-language-switch" aria-label="Избери език / Choose language"><button type="button" data-language="bg">BG</button><button type="button" data-language="en">EN</button></div>
        <button class="ws-top-refresh" id="waiterStableRefresh" type="button" aria-label="Обнови">↻</button>
      </header>
      <button class="ws-drawer-backdrop ws-hidden" id="waiterStableBackdrop" type="button" aria-label="Затвори менюто"></button>
      <aside class="ws-drawer" id="waiterStableMenu" aria-label="Меню">
        <div class="ws-drawer-head"><div class="ws-drawer-brand"><small>RESTAURANT</small><strong>ZORBAS</strong><span id="waiterStableSession"></span></div><button class="ws-close" id="waiterStableMenuClose" type="button" aria-label="Затвори">×</button></div>
        <nav class="ws-nav">
          <button type="button" data-nav-screen="areas">＋ Нова бележка / New note</button>
          <button type="button" data-nav-screen="notes">☰ Бележки / Notes</button>
          <button type="button" data-nav-screen="reservations">◷ Резервации / Reservations</button>
          <a href="/admin.html?view=manager">◎ Пълно управление</a>
          <a href="/kitchen.html">▤ Кухня</a>
          <a href="/print.html">⌁ Печат</a>
        </nav>
        <div class="ws-drawer-footer"><small id="waiterStableShiftLabel" class="ws-alert">Проверка на смяната…</small><button class="ws-primary ws-shift-button" id="waiterStableShift" type="button">Започни смяната</button><button class="ws-danger ws-full" id="waiterStableLogout" type="button">Изход</button></div>
      </aside>
      <main class="ws-content"><div class="ws-alert ws-hidden" id="waiterStableAlert"></div><div id="waiterStableContent"></div></main>
    </section>
  </div>
  <script src="/config.js?v=20260730-live1"></script>
  <script src="/live-sync.js?v=20260730-live1"></script>
  <script src="/waiter-stable.js?v=20260904-stable2"></script>
  <script src="/waiter-order-idempotency.js?v=20260905-1"></script>
  <script src="/waiter-reservation-guests.js?v=20260905-1"></script>
  <script src="/waiter-reservation-status.js?v=20260905-1"></script>
</body>
</html>
