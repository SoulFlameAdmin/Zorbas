<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1018"><title>ZORBAS · Сервитьори</title></head><body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1018;color:white;font-family:system-ui"><div id="waiterBoot">Зареждане на сервитьорския екран…</div><script>
(async()=>{
  try{
    const response=await fetch('/admin.html?waiter-shell=20260730-reservation1',{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    let html=await response.text();
    html=html.replace('<title>ZORBAS · Управление</title>','<title>ZORBAS · Сервитьори</title>');
    html=html.replace(/\/admin\.js\?v=[^\"]+/,'/admin.js?v=20260730-reservation1');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('waiterBoot').textContent='Не може да се зареди управлението: '+error.message;
  }
})();
</script></body></html>
